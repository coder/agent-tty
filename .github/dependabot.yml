version: 2
updates:
  # pnpm project (Dependabot detects pnpm from pnpm-lock.yaml and the
  # packageManager field). The 7-day cooldown (zizmor's minimum) also exceeds
  # pnpm-workspace.yaml's 1-day minimumReleaseAge, so version updates never
  # propose a release pnpm would refuse to resolve. Dependabot passes the
  # cooldown to pnpm as its minimum release age, which pnpm checks against
  # every locked package: a locked release younger than 7 days needs an
  # exact-version minimumReleaseAgeExclude entry in pnpm-workspace.yaml.
  # Dependabot also resolves on an empty store, where pnpm's trust check sees
  # every locked package.
  # .agents/skills/verify-agent-tty/scripts/dependabot-resolve.sh replays that
  # resolve.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
