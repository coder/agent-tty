# pnpm configuration (npm ignores this file, so settings here don't trigger
# "Unknown project config" warnings the way .npmrc keys do). Overrides and the
# build-script allowlist live in package.json's "pnpm" field.

# Supply-chain guards: skip versions published less than a day ago (the
# resolver falls back to an older match), and reject versions whose publish
# trust evidence weakens between releases.
minimumReleaseAge: 1440
# Dependabot runs pnpm with its 7-day cooldown as the minimum release age, and
# pnpm applies that age to every locked package: while one locked release is
# younger than 7 days, every npm version update fails. Exclude only such
# exact versions, so newer releases of the same package stay behind both
# age checks.
minimumReleaseAgeExclude:
  - '@coder/libghostty-vt-node@0.1.0-beta.7'
trustPolicy: no-downgrade

# Resolve optional platform dependencies for every platform devs and CI use,
# so the lockfile is identical no matter which host regenerates it.
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

trustPolicyExclude:
  # @octokit 9.x is the last CJS line (required by release-please, which is
  # CJS-only); octokit only publishes provenance attestations for the newer
  # pure-ESM majors, so this exact version has no trust evidence to verify.
  - '@octokit/endpoint@9.0.6'
  # semver 5.7.2 (2023) is a backport release without provenance, published
  # after 7.5.1 had it. release-please reaches it through
  # conventional-changelog-writer > meow > read-pkg-up > normalize-package-data.
  # A fresh resolve (Dependabot's `pnpm update` on an empty store) refuses it
  # as a trust downgrade, and then every npm update fails.
  - 'semver@5.7.2'
