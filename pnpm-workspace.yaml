# pnpm configuration (npm ignores this file, so settings here don't trigger
# "Unknown project config" warnings the way .npmrc keys do). Overrides and the
# build-script allowlist live in package.json's "pnpm" field.

# Supply-chain guards: skip versions published less than a day ago (the
# resolver falls back to an older match), and reject versions whose publish
# trust evidence weakens between releases.
minimumReleaseAge: 1440
# Our own packages skip the age check. Dependabot runs pnpm with its 7-day
# cooldown as the minimum release age, and pnpm applies that age to every
# locked package, so one @coder/* release younger than 7 days made every npm
# version update fail.
minimumReleaseAgeExclude:
  - '@coder/*'
trustPolicy: no-downgrade

# Resolve optional platform dependencies for every platform devs and CI use,
# so the lockfile is identical no matter which host regenerates it.
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

trustPolicyExclude:
  # @octokit 9.x is the last CJS line (required by release-please, which is
  # CJS-only); octokit only publishes provenance attestations for the newer
  # pure-ESM majors, so this exact version has no trust evidence to verify.
  - '@octokit/endpoint@9.0.6'
